name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-build:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asta_rental
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install

      - name: Run Linter
        run: npm run lint

      - name: Build Shared Package
        run: npm run build:shared

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Drizzle DB Migrations & Seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asta_rental?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci-super-secret-access-key-32chars
          JWT_REFRESH_SECRET: ci-super-secret-refresh-key-32chars
        run: |
          npm run db:migrate --workspace=backend
          npm run db:seed --workspace=backend

      - name: Run Backend Vitest Unit & Integration Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asta_rental?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci-super-secret-access-key-32chars
          JWT_REFRESH_SECRET: ci-super-secret-refresh-key-32chars
        run: npm run test --workspace=backend

      - name: Build Next.js Frontend
        run: npm run build --workspace=frontend

