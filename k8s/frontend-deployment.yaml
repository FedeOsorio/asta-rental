apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: asta-rental
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: asta-rental-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: asta-rental
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: frontend
