apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: asta-rental
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: asta-rental-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres@postgres:5432/asta_rental?schema=public"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: JWT_ACCESS_SECRET
              value: "k8s-prod-secret-access-key-32chars"
            - name: JWT_REFRESH_SECRET
              value: "k8s-prod-secret-refresh-key-32chars"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: asta-rental
spec:
  ports:
    - port: 4000
      targetPort: 4000
  selector:
    app: backend
